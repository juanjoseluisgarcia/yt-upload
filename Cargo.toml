[package]
name = "yt-upload"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
sha2 = "0.10"
hex = "0.4"
url = "2"
webbrowser = "0.8"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
